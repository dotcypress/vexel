mple:"point(0, 0, 'tomato', 12)"},{signature:"points(points, color?, size?)",text:"A dot at every [x, y] in points.",example:"points([[0, 0], [20, 10], [40, 30]], palette(1), 6)"},{signature:"line(x1, y1, x2, y2, color?, lineWidth?)",text:"Line segment.",example:"line(-50, -50, 50, 50, palette(2), 2)"},{signature:"polyline(points, color?, lineWidth?, closed?)",text:"Lines through the [x, y] points in order. closed = true joins the ends.",example:"polyline([[0, 0], [40, 80], [80, 0]], 'white', 2, true)"},{signature:"curve(x1, y1, cx, cy, x2, y2, color?, lineWidth?)",text:"Quadratic Bezier curve from x1, y1 to x2, y2, pulled toward the control point cx, cy.",example:"curve(-50, 0, 0, 80, 50, 0, palette(5), 2)"},{signature:"circle(x, y, radius, fill?, stroke?, lineWidth?)",text:"Circle centered at x, y.",example:"circle(0, 0, 40, 'hotpink', 'white', 2)"},{signature:"ellipse(x, y, rx, ry, fill?, stroke?, lineWidth?, rotation?)",text:"Ellipse centered at x, y with horizontal radius rx and vertical radius ry, rotated counterclockwise by rotation radians.",example:"ellipse(0, 0, 60, 30, palette(2), 'white', 2, PI / 6)"},{signature:"arc(x, y, radius, start, end, color?, lineWidth?)",text:"Part of a circle outline from angle start to end in radians, counterclockwise (clockwise when end < start).",example:"arc(0, 0, 40, 0, PI * 1.5, palette(1), 4)"},{signature:"rect(x, y, w, h, fill?, stroke?, lineWidth?)",text:"Rectangle with its bottom-left corner at x, y, extending w to the right and h up.",example:"rect(-40, -20, 80, 40, palette(3))"},{signature:"poly(points, fill?, stroke?, lineWidth?)",text:"Closed polygon through the [x, y] points, filled and/or stroked like circle().",example:"poly([[-40, -30], [40, -30], [0, 40]], palette(5), 'white', 2)"},{signature:"text(str, x, y, color?, size?, align?)",text:"Text centered vertically at x, y. size is in world units (default 14). align is 'left' (default), 'center' or 'right'.",example:"text('Hello', 0, 0, 'white', 24, 'center')"},{signature:"trail(id, x, y, color?, n?)",text:"Remembers the last n positions (default 50) under id and draws them as a line that fades out. Call it once per frame, e.g. inside animate.",example:["animate((t) => {","  clear()","  const x = cos(t) * 60, y = sin(t * 1.5) * 60","  trail('orbit', x, y, palette(1), 80)","  point(x, y, 'white', 8)","})"].join("\n")},{signature:"arrow(x1, y1, x2, y2, color?, lineWidth?, head?)",text:"Line with a filled arrowhead at x2, y2. head is the head length in screen pixels (default 8), capped at half the arrow.",example:"arrow(-60, -30, 60, 30, palette(1), px(2))"},{signature:"bezier(x1, y1, c1x, c1y, c2x, c2y, x2, y2, color?, lineWidth?)",text:"Cubic Bezier curve from x1, y1 to x2, y2, pulled toward the two control points.",example:"bezier(-80, 0, -40, 80, 40, -80, 80, 0, palette(2), px(2))"},{signature:"spline(points, color?, lineWidth?, closed?)",text:"Smooth curve through every [x, y] point (Catmull-Rom), the smooth version of polyline. closed = true loops back to the start.",example:"const pts = range(8).map((i) => [i * 25 - 90, random(-50, 50)])\nspline(pts, palette(0), px(2))\npoints(pts, 'white', px(5))"},{signature:"wedge(x, y, radius, start, end, fill?, stroke?, lineWidth?)",text:"Pie slice from angle start to end (radians, counterclockwise). fill and stroke work like circle().",example:"const data = [3, 5, 2, 6]\nconst total = data.reduce((a, b) => a + b)\nlet a = 0\ndata.forEach((v, i) => {\n  wedge(0, 0, 80, a, a + 2 * PI * v / total, palette(i))\n  a += 2 * PI * v / total\n})"},{signature:"label(str, x, y, color?, size?, align?)",text:"Like text, but size is in screen pixels (default 12), so it stays readable at any zoom. align is 'left' (default), 'center' or 'right'.",example:"point(40, 20, palette(1), px(6))\nlabel('A (40, 20)', 40 + px(6), 20, 'white')"},{signature:"textBox(str, x, y, color?, size?, align?)",text:"Text on a dark backdrop, in screen pixels (default size 12), split into lines at \\n. x, y is the box's top-left corner, or its top center or top right with align 'center' or 'right'. As an object: { color, size, align, background }. Good for notes and tooltips.",example:"const p = drag('p', 40, 30)\nclear()\ngrid()\ntextBox('point\\nx = ' + p[0].toFixed(1) + '\\ny = ' + p[1].toFixed(1), p[0] + px(14), p[1] - px(10))"},{signature:"dims(x1, y1, x2, y2, text?, color?, offset?)",text:"A dimension line between two points, like on a technical drawing: extension lines, arrows and a label. text defaults to the distance. offset is how far from the points it is drawn, in screen pixels (default 16; negative for the other side).",example:"clear()\nrect(-60, -30, 120, 60, false, 'white', px(2))\ndims(-60, 30, 60, 30)\ndims(60, 30, 60, -30, '60 mm')"},{signature:"font(family?, weight?, italic?)",text:"Sets the font for text, label, textBox, dims and axis titles for the rest of the run; font() goes back to the default. family is a font name or 'sans', 'serif', 'mono' or 'rounded'. weight is 'bold' or 100 to 900. A style object works too: text('hi', 0, 0, { font: 'serif', weight: 'bold', italic: true }).",example:"font('serif', 'bold')\ntext('Serif heading', -100, 20, 'white', 24)\nfont()\ntext('back to the default', -100, -10, '#aab0c4', 14)"},{signature:"loadFont(name, url?, descriptors?)",text:"Loads a web font and returns true once it is ready; the sketch redraws when it arrives. With only a name it comes from Google Fonts (regular, bold and italic where available); with a url it loads that font file, which must allow cross-origin requests. Use the name as font afterwards. Errors go to the console.",example:"loadFont('Lobster')\nclear()\ntext('Hello, Lobster', -120, 0, { color: palette(0), size: 36, font: 'Lobster' })"},{signature:"image(src, x, y, w?, h?)",text:"Draws a picture (any URL, including data: URLs) with its bottom-left corner at x, y. Without w and h it is one world unit per image pixel; with only w the aspect ratio is kept. It loads in the background and the sketch redraws when it arrives; returns whether it was drawn.",example:"image('https://upload.wikimedia.org/wikipedia/commons/4/47/PNG_transparency_demonstration_1.png', -100, -75, 200)"},{signature:"transform(fn, { x?, y?, rotate?, scale? })",text:"Calls fn with the world moved to x, y, rotated by rotate radians and scaled by scale (a number or [sx, sy]), then puts everything back. Returns what fn returns.",example:"animate((t) => {\n  clear()\n  transform(() => rect(-30, -30, 60, 60, palette(4)), { x: 40, rotate: t })\n})"}]},{title:"Plots",note:"heat paints opaque cells over the whole view, so call it right after clear() and draw everything else on top. Ramps for heat and scatter: viridis (default), magma, inferno, plasma, cividis (color-blind safe), turbo, hot and gray for values from low to high; coolwarm for values on both sides of a middle (0.5 is neutral); vexel, the brand sunflower ramp (dark blue to green to gold), with lightness rising from low to high. Or pass a function t => color.",helpers:[{signature:"plot(f, color?, lineWidth?, from?, to?)",text:"Graph of y = f(x) over the visible x range, or from..to. Leaves gaps where f is not a finite number.",example:"plot((x) => 40 * sin(x / 20), palette(0), 2)"},{signature:"plotParam(fx, fy, color?, lineWidth?, from?, to?)",text:"Parametric curve x = fx(t), y = fy(t) for t from from to to (default 0 to 2*PI), with the interval last like plot. Leaves gaps where either is not a finite number.",example:"plotParam((t) => 60 * sin(3 * t), (t) => 60 * sin(2 * t), palette(3), 2, 0, 2 * PI)"},{signature:"plotPolar(f, color?, lineWidth?)",text:"Graph of r = f(theta) for theta from 0 to 2*PI. Leaves gaps where f is not a finite number.",example:"plotPolar((a) => 50 + 20 * cos(5 * a), palette(4), 2)"},{signature:"contour(f, level?, color?, lineWidth?)",text:"Draws the curve where f(x, y) = level (default 0), including every separate branch. Handy for circles, level sets and other implicit curves.",example:"contour((x, y) => hypot(x, y) - 50, 0, palette(2), px(2))"},{signature:"field(f, step?, color?, lineWidth?)",text:"Vector field: f(x, y) returns [dx, dy] and an arrow is drawn every step world units (default 20). Arrows are as long as the vector but capped just below step; scale your vectors to taste.",example:"field((x, y) => [-y, x], 20, palette(5))"},{signature:"heat(f, ramp?, cell?)",text:"Colors the view by f(x, y), which returns a number from 0 to 1 (clamped). ramp is the name of a colormap ('viridis' by default) or a function t => color; the Plots note above lists the names. f is called once per square cell; cell sets its size in screen pixels (by default about 8 to 10, so the view holds about 10,000 cells). A cell of 1 samples every pixel: sharp, but much slower.",example:"heat((x, y) => 0.5 + 0.5 * sin(hypot(x, y) / 15), 'magma', 2)"},{signature:"scatter(points, ramp?, size?)",text:"Dots from [x, y, value] points, colored by value (0 to 1, clamped) with a ramp, as in heat. size is the diameter (default 4).",example:"scatter(range(200).map((i) => [i - 100, 40 * sin(i / 10), i / 200]), 'turbo', 6)"},{signature:"bars(list, width?, color?)",text:"Bar chart from a list of numbers: bar i fills the slot from i * width (default 10) and is as tall as its value, in world units. color is one color or a function (i, value) => color.",example:"bars([30, 80, 55, 120, 90], 20, (i) => palette(i))"},{signature:"hist(list, bins?, color?)",text:"Histogram of a list of numbers in bins (default 10) between their smallest and largest value. x is the data value and a bar is as tall as its count, in world units. Returns the counts.",example:"hist(range(500).map(() => 100 * (random() + random() + random()) / 3), 20, palette(0))"}]},{title:"Vectors",note:"Vectors and points are [x, y] arrays, so spread them into the shape helpers: line(...a, ...b).",helpers:[{signature:"add(a, b), sub(a, b)",text:"Sum and difference of two [x, y] vectors.",example:"const a = [60, 20], b = [10, 50]\narrow(0, 0, ...a, palette(0))\narrow(0, 0, ...b, palette(1))\narrow(0, 0, ...add(a, b), 'white')"},{signature:"scale(v, k)",text:"The vector v times k.",example:"arrow(0, 0, ...scale([30, 20], 3), palette(2))"},{signature:"dot(a, b), len(v), norm(v)",text:"Dot product, length, and the vector scaled to length 1 ([0, 0] stays [0, 0]).",example:"const v = [30, 40]\nhud({ len: len(v), dot: dot(v, [1, 0]) })\narrow(0, 0, ...scale(norm(v), 100), palette(3))"},{signature:"dist(a, b)",text:"Distance between two [x, y] points, or dist(x1, y1, x2, y2).",example:"const p = drag('p', 50, 30)\nline(0, 0, ...p, 'white')\nlabel(dist([0, 0], p).toFixed(1), ...p)"},{signature:"rot(v, angle, around?)",text:"v rotated by angle radians counterclockwise around the point around (default the origin).",example:"range(12).forEach((i) => point(...rot([80, 0], i * PI / 6), palette(i), px(8)))"},{signature:"angle(v), polar(r, theta)",text:"The direction of v in radians, and the [x, y] at distance r in direction theta.",example:"const p = polar(80, PI / 3)\narrow(0, 0, ...p, palette(0))\nhud(angle(p))"},{signature:"intersect(a1, a2, b1, b2)",text:"Where segment a1-a2 crosses segment b1-b2, as [x, y], or null if they do not cross.",example:"const a = drag('a', -80, -40), b = drag('b', 80, 40)\nline(...a, ...b, 'white')\nline(-60, 50, 60, -50, palette(1))\nconst p = intersect(a, b, [-60, 50], [60, -50])\nif (p) point(...p, palette(2), px(10))"}]},{title:"Colors",helpers:[{signature:"palette(i)",text:"The i-th color of the built-in 16-color Sunflower palette. Wraps around, so any integer works. palette(0) is the brand gold, each color differs strongly from the one before, and the first 8 stay distinct for red-green color blindness, so use them first for data series.",example:"circle(0, 0, 30, palette(2))"},{signature:"hsl(h, s, l, a?)",text:"Color string. h is degrees, s and l are 0-100, a is 0-1 (default 1).",example:"point(0, 0, hsl(200, 80, 60), 20)"},{signature:"rgb(r, g, b, a?)",text:"Color string. r, g, b are 0-255, a is 0-1 (default 1).",example:"rect(0, 0, 50, 50, rgb(255, 120, 0, 0.5))"},{signature:"mix(c1, c2, t?)",text:"The color c1 mixed t of the way (0 to 1, default 0.5) toward c2. Works with any CSS color.",example:"range(10).forEach((i) => circle(i * 20 - 90, 0, 9, mix('tomato', 'royalblue', i / 9)))"},{signature:"alpha(color, a)",text:"The color with its opacity multiplied by a (0 to 1).",example:"circle(-20, 0, 50, alpha(palette(0), 0.5))\ncircle(20, 0, 50, alpha(palette(1), 0.5))"},{signature:"ramp(name, t)",text:"The color at t (0 to 1, clamped) of a built-in ramp such as 'viridis', or of your own ramp function.",example:"range(20).forEach((i) => rect(i * 10 - 100, -20, 10, 40, ramp('plasma', i / 19)))"}]},{title:"Numbers and random",note:"range excludes its end (like Python) while linspace includes both ends (like NumPy).",helpers:[{signature:"range(a, b, step?)",text:"Numbers from a up to, but not including, b in steps of step (default 1). range(n) counts from 0 to n - 1. A negative step counts down; a step pointing away from b gives an empty list.",example:"points(range(-100, 101, 20).map((x) => [x, x * x / 100]), palette(0), 6)"},{signature:"linspace(a, b, n)",text:"n evenly spaced numbers from a to b, both included. Handy for sampling a curve.",example:"polyline(linspace(0, PI * 2, 60).map((a) => [cos(a) * 50, sin(a) * 50]), palette(2), 2, true)"},{signature:"lerp(a, b, t)",text:"The value t of the way from a to b: lerp(10, 20, 0.5) is 15. t is not clamped, so values outside 0..1 extrapolate.",example:"circle(lerp(-80, 80, 0.25), 0, 20, hsl(lerp(200, 320, 0.25), 80, 60))"},{signature:"grid2d(cols, rows, fn)",text:"Calls fn(col, row, i) for every cell of a cols by rows grid, row by row from the bottom, and returns the results as a list. i is row * cols + col.",example:"grid2d(8, 5, (c, r, i) => rect(c * 22, r * 22, 20, 20, palette(i)))"},{signature:"normalize(list)",text:"The list rescaled so its smallest number becomes 0 and its largest 1. All-equal lists become all 0, and entries that are not finite numbers become NaN. Good for scatter and heat values.",example:"const ys = range(40).map((i) => sin(i / 5) * 30 + i)\nscatter(ys.map((y, i) => [i * 5, y, normalize(ys)[i]]), 'viridis', 6)"},{signature:"bounds(points)",text:"The rectangle around [[x, y], ...] as [x, y, w, h], with x, y the bottom-left corner. Pass it straight to fit. Points that are not finite are ignored; an empty list gives [0, 0, 0, 0].",example:"const pts = range(30).map((i) => [i * 8, 40 * sin(i / 4)])\npoints(pts, 6, palette(1))\nfit(...bounds(pts))"},{signature:"random(a?, b?)",text:"Seeded random number: random() is 0..1, random(b) is 0..b, random(a, b) is a..b, and random(list) picks an item. The sequence restarts on every run, so panning or moving a slider redraws the same picture.",example:"const colors = [palette(0), palette(4), palette(6)]\nrange(200).forEach(() => {\n  point(random(-150, 150), random(-100, 100), random(colors), random(2, 8))\n})"},{signature:"seed(n)",text:"Restarts random() and gauss() from seed n, for a different but still repeatable sequence. Every run starts from seed 1.",example:"seed(slider('seed', 1, 100, 1, 1))\nrange(30).forEach(() => {\n  const x = random(-150, 150)\n  const y = random(-100, 100)\n  circle(x, y, random(5, 25), hsl(random(360), 70, 60, 0.6))\n})"},{signature:"gauss(mean?, sd?)",text:"Seeded normally distributed number with the given mean (default 0) and standard deviation (default 1). Most values land within 2 sd of the mean.",example:"clear()\naxes()\nhist(range(2000).map(() => gauss(100, 25)), 30)\nfit(0, -10, 200, 280)"},{signature:"clamp(x, lo?, hi?)",text:"x limited to lo..hi (default 0..1).",example:"hud(clamp(1.7), clamp(-5, -1, 1))"},{signature:"map(x, a1, b1, a2?, b2?)",text:"x rescaled from the range a1..b1 to a2..b2 (default 0..1). Not clamped.",example:"circle(0, 0, map(mouse.x, -100, 100, 5, 60), palette(3))"},{signature:"smoothstep(a, b, x)",text:"0 below a, 1 above b, and a smooth S-curve in between.",example:"plot((x) => 50 * smoothstep(-50, 50, x), palette(2), px(2))"},{signature:"ease(t, kind?)",text:"Easing curve for t in 0..1 (clamped): 'linear', 'in', 'out', 'inOut' (default), 'sine', 'back', 'elastic' or 'bounce'.",example:"animate((t) => {\n  clear()\n  circle(-100 + 200 * ease(t / 2 % 1, 'bounce'), 0, 12, palette(1))\n})"},{signature:"noise(x, y?, z?)",text:"Seeded Perlin noise from 0 to 1 for 1, 2 or 3 coordinates. It changes smoothly over about one unit, so scale world coordinates down. Follows seed().",example:"heat((x, y) => noise(x / 40, y / 40), 'viridis')"}]},{title:"Animation and state",helpers:[{signature:"every(seconds, fn?, key?)",text:"Use inside animate. True once every given number of seconds (the first time one period in), and calls fn when it is. Calls with the same period and function share a timer; pass a key to tell them apart.",example:"let hue = 0\nanimate(() => {\n  every(0.5, () => (hue += 40))\n  clear()\n  circle(0, 0, 60, hsl(hue, 80, 60))\n})"},{signature:"once(fn, key?)",text:"Calls fn the first time and returns the same result after that: on later frames, and when panning, zooming or a control re-runs the sketch. Use it for expensive setup or state that should survive re-runs. Editing the code starts over. Without a key, functions with identical source share a result; pass a key to tell them apart.",example:"const stars = once(() =>\n  range(300).map(() => [Math.random() * 400 - 200, Math.random() * 300 - 150])\n)\nclear('#14161b')\npoints(stars, 3, 'white')\nhud('pan around: the stars stay put')"},{signature:"pause(on?)",text:"pause() toggles, pause(true) and pause(false) set. While paused, time stands still and animate is only called when the view moves or step() is used. Returns whether animation is paused.",example:"animate((t) => {\n  pause(toggle('paused'))\n  if (button('step')) step()\n  clear()\n  circle(cos(t) * 80, sin(t) * 80, 10, palette(0))\n})"},{signature:"step()",text:"While paused, advances the animation by one 1/60 s frame.",example:"animate((t) => {\n  pause(true)\n  if (button('step')) step()\n  clear()\n  hud(t)\n})"}]},{title:"Controls",note:"slider, toggle, select and button are drawn in the top-right corner in screen pixels, on top of the sketch, so they ignore pan and zoom. Call clear() first in animated sketches so they do not smear. Slider, toggle and select values survive re-runs.",helpers:[{signature:"slider(name, min, max, value?, step?)",text:"Adds a slider to the top-right of the preview and returns its current value (default min).",example:"const r = slider('radius', 5, 100, 40)\ncircle(0, 0, r, palette(0))"},{signature:"toggle(name, value?)",text:"Adds a checkbox next to the sliders and returns whether it is on (default off).",example:"if (toggle('grid', true)) {\n  grid()\n}"},{signature:"select(name, options, value?)",text:"Adds a chooser next to the sliders and returns the chosen option, which can be any value. Click its left half to go back and its right half to go forward. value is the initial option (default: the first).",example:"const ramp = select('ramp', ['viridis', 'plasma', 'coolwarm'])\nheat((x, y) => 0.5 + 0.5 * sin(x / 20), ramp)"},{signature:"button(name)",text:"Adds a button to the control panel. Returns true for the one frame after it is clicked (or the one re-run, in a sketch without animate).",example:"let n = 0\nanimate(() => {\n  if (button('add a dot')) {\n    n++\n  }\n  clear()\n  range(n).forEach((i) => circle(i * 30 - 150, 0, 10, palette(i)))\n})"},{signature:"number(name, value?, step?, min?, max?)",text:"Adds a number field to the control panel and returns its value (default 0). Click - or + to step it by step (default 1), or drag the number left and right to scrub. min and max limit it. The value survives re-runs.",example:"const sides = number('sides', 6, 1, 3, 20)\npoly(range(sides).map((i) => polar(80, (i * 2 * PI) / sides)), palette(4))"},{signature:"slider2d(name, min?, max?, value?)",text:"Adds an x/y pad to the control panel and returns [x, y], each from min to max (default -1 to 1). value is the initial [x, y] (default the middle). The value survives re-runs.",example:"const [x, y] = slider2d('offset', -100, 100)\ncircle(x, y, 20, palette(5))"},{signature:"swatch(name, value?)",text:"Adds a color picker with the 16 palette colors and returns the chosen color. value is the initial palette index or color (default 0).",example:"circle(0, 0, 50, swatch('fill', 2))"}]},{title:"Mouse and keyboard",note:"Click the preview first to give it keyboard focus.",helpers:[{signature:"mouse.clicked",text:"True for the one frame after the left button goes down on the sketch. Clicks on controls do not count.",example:"const dots = []\nanimate(() => {\n  if (mouse.clicked) {\n    dots.push([mouse.x, mouse.y])\n  }\n  clear()\n  points(dots, palette(2), 12)\n  hud('click to add dots')\n})"},{signature:"key(name)",text:"True while the key is held, e.g. 'ArrowLeft', 'a' or 'Space'. Click the preview first to give it keyboard focus.",example:["let x = 0","animate(() => {","  clear()","  if (key('ArrowRight')) {","    x += 2","  }","  circle(x, 0, 10, palette(1))","})"].join("\n")},{signature:"hover(x, y, r)",text:"True while the pointer is within r world units of x, y (r scales with zoom, unlike drag). Sketches without animate re-run when the result changes.",example:"circle(0, 0, 30, hover(0, 0, 30) ? palette(1) : palette(0))"},{signature:"drag(id, x, y, r?, color?)",text:"A round handle the user can drag with the left button, starting at x, y. Returns its current [x, y]. The position survives re-runs and code edits; rename the id to start over. r is the radius in screen pixels (default 8), so handles keep their size at any zoom, unlike hover. Handles are drawn on top of the sketch, like the controls.",example:"const [ax, ay] = drag('a', -80, -40, 8, palette(0))\nconst [bx, by] = drag('b', 80, 40, 8, palette(1))\nclear()\ngrid()\nline(ax, ay, bx, by, 'white', px(2))\nhud('length ' + hypot(bx - ax, by - ay).toFixed(1))"}]},{title:"Data",note:"file and load return null until the data is there, then the sketch runs again, so start with: if (!rows) return hud('loading'). Formats come from the file extension: .csv, .tsv, .json and .txt; pass format ('csv', 'tsv', 'json', 'text' or 'lines') to override. CSV rows become objects keyed by the header, numbers and true/false are converted, and empty cells become null. Files up to 20 MB.",helpers:[{signature:"file(name, format?)",text:"Adds a file row to the control panel and returns the parsed data, or null until a file is chosen. Click the row to pick a file, or drop one onto the preview; the × clears it. The file stays with the sketch across edits and reloads, and Export HTML includes it. Nothing is uploaded.",example:"const rows = file('data')\nif (!rows) return hud('click \"data\" or drop a CSV file')\nhud(rows.length + ' rows', 'columns: ' + rows.columns.join(', '))"},{signature:"load(url, format?, { every? })",text:"Fetches a URL once and returns the parsed data, or null while it loads; the sketch runs again when it arrives. { every: seconds } fetches it again on that interval for live data, keeping the last result in between. The server must allow cross-origin requests (raw GitHub files and most public APIs do). Errors go to the console.",example:"const rows = load('https://raw.githubusercontent.com/vega/vega-datasets/main/data/seattle-weather.csv')\nif (!rows) return hud('loading...')\nclear()\naxes({ xLabel: 'day', yLabel: 'max temp' })\npolyline(rows.map((r, i) => [i / 4, r.temp_max * 5]), palette(0), px(1.5))"},{signature:"csvParse(text, { header?, delimiter?, typed? })",text:'Parses CSV text. With a header (default) rows are objects and the result has .columns; header: false gives arrays. The delimiter (comma, semicolon or tab) is detected; typed: false keeps every cell as a string. Handles quotes, doubled "" and line breaks inside quotes.',example:"const rows = csvParse('name,score\\nA elte-ymr6bo">clicked</code>,\n                true for the one frame after a click on the sketch.</dd> <dt class="svelte-ymr6bo"><code class="svelte-ymr6bo">frame</code></dt> <dd class="svelte-ymr6bo"><code class="svelte-ymr6bo">n</code> (frame index), <code class="svelte-ymr6bo">time</code> and <code class="svelte-ymr6bo">dt</code> (seconds), <code class="svelte-ymr6bo">fps</code> (smoothed).</dd> <dt class="svelte-ymr6bo"><code class="svelte-ymr6bo">sin, cos, PI, …</code></dt> <dd class="svelte-ymr6bo">Every <code class="svelte-ymr6bo">Math</code> function and constant is global, except <code class="svelte-ymr6bo">log</code>,\n                which prints (use <code class="svelte-ymr6bo">Math.log</code>), and <code class="svelte-ymr6bo">random</code>, which is seeded\n                (use <code class="svelte-ymr6bo">Math.random</code> for unseeded numbers).</dd></dl></section>',1),MM=Wi('<p class="note svelte-ymr6bo"> </p>'),CM=Wi('<div class="entry svelte-ymr6bo"><code class="signature svelte-ymr6bo"><span class="name svelte-ymr6bo"> </span><span class="params svelte-ymr6bo"> </span></code> <p class="description svelte-ymr6bo"> </p> <!></div>'),TM=Wi('<section class="svelte-ymr6bo"><h3 class="svelte-ymr6bo"> </h3> <!> <!></section>'),ZM=Wi('<p class="empty svelte-ymr6bo"> </p>'),RM=Wi('<dt class="svelte-ymr6bo"><kbd class="svelte-ymr6bo"> </kbd></dt> <dd class="svelte-ymr6bo"> </dd>',1),_M=Wi('<section id="help-shortcuts" class="svelte-ymr6bo"><h3 class="svelte-ymr6bo">Shortcuts</h3> <dl class="keys svelte-ymr6bo"></dl></section>'),XM=Wi('<dialog class="svelte-ymr6bo"><div class="panel svelte-ymr6bo"><header class="svelte-ymr6bo"><h2 class="svelte-ymr6bo">Help</h2> <input class="search svelte-ymr6bo" type="search" placeholder="Search helpers…" aria-label="Search helpers"/> <button class="close svelte-ymr6bo" aria-label="Close help">✕</button></header> <div class="columns svelte-ymr6bo"><nav class="toc svelte-ymr6bo" aria-label="Help sections"><!> <!> <!></nav> <div class="body svelte-ymr6bo"><!> <!> <!></div></div></div></dialog>'),Ri(["click","keydown"])}),UM=m(()=>{});var VM,GM,FM,HM,KM,JM,eC,tC,nC=m(()=>{fl(),Xs(),js(),UM(),zM=Wi("<span> </span>"),WM=Wi('<button class="clear svelte-180pohc">Clear</button>'),DM=Wi('<span class="repeat svelte-180pohc"> </span>'),IM=Wi('<div><span class="text"> </span> <!></div>'),YM=Wi('<div class="empty svelte-180pohc">Nothing logged yet. Call <code class="svelte-180pohc">log(...)</code> in your sketch.</div>'),BM=Wi('<div class="lines svelte-180pohc"></div>'),qM=Wi('<div><div class="bar svelte-180pohc"><button class="toggle svelte-180pohc"><span class="chevron svelte-180pohc"> </span> Console <!></button> <!></div> <!></div>'),Ri(["click"])}),iC=m(()=>{pM(),VM=[{id:"sunflower",title:"Sunflower",group:"Basics",description:"animate, slider, hsl, point: dots on the golden angle.",code:JA},{id:"shapes",title:"Shapes",group:"Basics",description:"point, line, arrow, bezier, spline, circle, wedge, poly, label, dims: every drawing helper once.",code:"// Every drawing helper once. Y points up and (0, 0) is the center.\nclear()\ngrid()\naxes()\n\npoint(-200, 90, palette(0), 14)\npoints([[-175, 95], [-155, 80], [-135, 92]], palette(1), 8)\nline(-210, 50, -130, 30, palette(2), 3)\npolyline([[-210, 0], [-185, -30], [-160, 0], [-135, -30]], palette(3), 3)\ncurve(-210, -80, -170, -10, -130, -80, palette(4), 3)\nbezier(-210, -110, -190, -60, -150, -150, -130, -100, palette(9), 3)\narrow(-110, 90, -60, 110, 'white', px(2))\nline(-110, 60, -60, 60, { color: 'white', width: px(2), dash: [6, 4] })\nspline([[-110, 20], [-95, 40], [-80, 10], [-65, 35]], palette(10), 3)\n\ncircle(0, 70, 30, palette(5))\ncircle(0, 70, 40, false, palette(5), px(2))\nellipse(0, -5, 45, 20, palette(6), 'white', px(1), PI / 8)\narc(0, -75, 25, 0, PI * 1.5, palette(7), 5)\nwedge(-80, -75, 30, PI / 6, PI * 1.3, palette(11))\n\nrect(140, 40, 60, 50, palette(8), 'white', px(1))\ndims(140, 90, 200, 90)\nrect(210, 40, 25, 50, rgb(255, 160, 40, 0.8))\n\nconst star = range(10).map((i) => {\n  const r = i % 2 ? 17 : 42\n  const a = PI / 2 + (i * PI) / 5\n  return [185 + r * cos(a), -40 + r * sin(a)]\n})\npoly(star, hsl(45, 95, 60), 'white', px(1))\n\ntext('shapes', 0, -125, 'white', 20, 'center')\nlabel('label() keeps its size when you zoom', 185, -100, '#aab0c4', 11, 'center')\nfit(-230, -160, 480, 290)\n"},{id:"clock",title:"Clock",group:"Basics",description:"line, polar, text, animate: an analog clock.",code:"// An analog clock showing the current time.\nfit(-130, -130, 260, 260)\n\n// Clock angles: 0 turns is 12 o'clock, and turns go clockwise.\nconst clockAngle = (turns) => PI / 2 - turns * 2 * PI\n\nfunction hand(turns, length, color, width) {\n  line(0, 0, ...polar(length, clockAngle(turns)), color, width)\n}\n\nanimate(() => {\n  const now = new Date()\n  const seconds = now.getSeconds() + now.getMilliseconds() / 1000\n  const minutes = now.getMinutes() + seconds / 60\n  const hours = (now.getHours() % 12) + minutes / 60\n\n  clear()\n  circle(0, 0, 110, '#262a35', 'white', 3)\n  for (let i = 0; i < 60; i++) {\n    const a = clockAngle(i / 60)\n    const inner = i % 5 ? 100 : 92\n    line(...polar(inner, a), ...polar(106, a), 'white', i % 5 ? 1 : 3)\n  }\n  for (let n = 1; n <= 12; n++) {\n    text(n, ...polar(78, clockAngle(n / 12)), '#aab0c4', 14, 'center')\n  }\n\n  hand(hours / 12, 55, 'white', 6)\n  hand(minutes / 60, 85, 'white', 4)\n  hand(seconds / 60, 95, palette(3), 2)\n  circle(0, 0, 5, palette(3))\n})\n"},{id:"balls",title:"Bouncing balls",group:"Basics",description:"animate, random, mouse.clicked: gravity and bounces.",code:"// Balls bouncing under gravity. Click to add one.\nconst W = 300\nconst H = 200\nconst balls = []\n\nfunction addBall(x, y) {\n  balls.push({ x, y, vx: random(-150, 150), vy: random(0, 200), r: random(8, 20), color: palette(balls.length) })\n}\n\nfor (let i = 0; i < 8; i++) {\n  addBall(random(-250, 250), random(0, 150))\n}\nfit(-W, -H, 2 * W, 2 * H)\n\nanimate((t, dt) => {\n  const gravity = slider('gravity', 0, 1000, 500)\n  const bounce = slider('bounce', 0.5, 1, 0.9, 0.01)\n  if (mouse.clicked) {\n    addBall(mouse.x, mouse.y)\n  }\n\n  dt = min(dt, 0.05)\n  for (const b of balls) {\n    b.vy -= gravity * dt\n    b.x += b.vx * dt\n    b.y += b.vy * dt\n    if (b.y - b.r < -H) {\n      b.y = -H + b.r\n      b.vy = abs(b.vy) * bounce\n    }\n    if (abs(b.x) + b.r > W) {\n      b.x = sign(b.x) * (W - b.r)\n      b.vx = -b.vx\n    }\n  }\n\n  clear()\n  rect(-W, -H, 2 * W, 2 * H, false, '#5b6cf0', px(2))\n  for (const b of balls) {\n    circle(b.x, b.y, b.r, b.color)\n  }\n})\n"},{id:"solar",title:"Solar system",group:"Basics",description:"circle, polar, label, toggle: planets on their orbits.",code:"// Planets on circular orbits. Inner planets go around faster.\nconst planets = [\n  { name: 'Mercury', r: 40, size: 4, color: '#b0a89f' },\n  { name: 'Venus', r: 60, size: 7, color: '#e8c27a' },\n  { name: 'Earth', r: 85, size: 7, color: '#5b9cf0' },\n  { name: 'Mars', r: 110, size: 5, color: '#e2683c' },\n  { name: 'Jupiter', r: 150, size: 14, color: '#d9a066' },\n  { name: 'Saturn', r: 195, size: 12, color: '#e8d08f' }\n]\nlet time = 0\n\nfit(-220, -220, 440, 440)\n\nanimate((t, dt) => {\n  const speed = slider('speed', 0, 5, 1, 0.1)\n  const labels = toggle('labels', true)\n  time += speed * dt\n\n  clear()\n  circle(0, 0, 18, '#ffcc44')\n  planets.forEach((p, i) => {\n    const [x, y] = polar(p.r, i * 2.4 + (time * 200) / p.r ** 1.5)\n    circle(0, 0, p.r, false, 'rgba(255, 255, 255, 0.12)', px(1))\n    circle(x, y, p.size, p.color)\n    if (labels) {\n      label(p.name, x + p.size + px(4), y, '#aab0c4', 11)\n    }\n  })\n})\n"},{id:"plot",title:"Plot functions",group:"Math",description:"plot, slider, toggle, legend: y = f(x) with live controls.",code:"// Graphs of y = f(x). Without animate, the sketch re-runs when a control changes.\nconst amp = slider('amplitude', 0, 100, 50)\nconst freq = slider('frequency', 5, 100, 30, 1)\nconst showCos = toggle('cosine', true)\n\nconst curves = [\n  ['sin', (x) => amp * sin(x / freq), palette(0)],\n  ['1000 / x', (x) => 1000 / x, palette(2)]\n]\nif (showCos) {\n  curves.push(['cos', (x) => amp * cos(x / freq), palette(1)])\n}\n\nclear()\ngrid(10, null, 50)\naxes({ xLabel: 'x', yLabel: 'y' })\n\nfor (const [name, f, color] of curves) {\n  plot(f, color, px(2))\n}\nlegend(curves.map(([name, f, color]) => [name, color]))\n\nfit(-300, -150, 600, 300)\n"},{id:"rose",title:"Polar rose",group:"Math",description:"plotPolar, plotParam, number: r = R cos(n/d theta), spinning.",code:"// Polar roses r = R cos(k theta). With k = n / d the curve closes after d turns.\nconst R = 130\nfit(-170, -170, 340, 340)\n\nanimate((t) => {\n  const n = number('n', 5, 1, 1, 12)\n  const d = number('d', 4, 1, 1, 9)\n\n  const spin = t * 0.15\n  const r = (a) => R * cos((n / d) * a)\n  const x = (a) => r(a) * cos(a + spin)\n  const y = (a) => r(a) * sin(a + spin)\n  const a = (t * 0.9) % (2 * PI * d)\n\n  clear()\n  grid(25, null, 100)\n  plotPolar((a) => R * cos(n * a), 'rgba(255, 255, 255, 0.12)', px(1))\n  plotParam(x, y, palette(5), px(2.5), 0, 2 * PI * d)\n  trail('dot', x(a), y(a), 'white', 60)\n  point(x(a), y(a), 'white', 9)\n})\n"},{id:"lissajous",title:"Lissajous curve",group:"Math",description:"plotParam, trail, number: x = sin(a t), y = sin(b t + phase).",code:"// A Lissajous curve whose phase slowly drifts.\nfit(-160, -160, 320, 320)\n\nanimate((t) => {\n  const a = number('a', 3, 1, 1, 9)\n  const b = number('b', 2, 1, 1, 9)\n  const drift = slider('drift', 0, 1, 0.2, 0.01)\n\n  const x = (s) => 120 * sin(a * s)\n  const y = (s) => 120 * sin(b * s + t * drift)\n\n  clear()\n  grid(20, null, 100)\n  axes()\n  plotParam(x, y, hsl(t * 20, 80, 70, 0.6), px(1.5), 0, 2 * PI)\n  trail('dot', x(t), y(t), palette(1), 120)\n  point(x(t), y(t), 'white', 10)\n})\n"},{id:"easing",title:"Easing curves",group:"Math",description:"ease, plot, legend: every easing curve, with racing dots.",code:"// Easing curves turn steady time (0 to 1) into motion that speeds up, slows down or bounces.\n// Left: each curve. Right: a dot moving along a track with that curve.\nconst S = 200\nconst kinds = ['linear', 'in', 'out', 'inOut', 'sine', 'back', 'elastic', 'bounce']\n\nfit(-20, -30, S + 300, S + 60)\n\nanimate((t) => {\n  const seconds = slider('seconds', 0.5, 4, 2, 0.1)\n  const progress = min(1, (t / seconds) % 1.4)   // a short pause at the end of each run\n\n  clear()\n  rect(0, 0, S, S, false, 'rgba(255, 255, 255, 0.3)', px(1))\n  kinds.forEach((kind, i) => {\n    const color = palette(i)\n    plot((x) => S * ease(x / S, kind), color, px(2), 0, S)\n\n    const y = S - (i * S) / (kinds.length - 1)\n    line(S + 50, y, S + 250, y, 'rgba(255, 255, 255, 0.15)', px(1))\n    point(S + 50 + 200 * ease(progress, kind), y, color, px(10))\n  })\n  legend(kinds.map((kind, i) => [kind, palette(i)]), 'ease(t, kind)')\n})\n"},{id:"spirograph",title:"Spirograph",group:"Math",description:"plotParam, circle, line: a pen on a circle rolling inside another.",code:"// A spirograph: a wheel of radius r rolls inside a ring of radius R,\n// with a pen at distance d from the wheel's center.\nconst R = 120\nconst gcd = (a, b) => (b ? gcd(b, a % b) : a)\nlet s = 0\n\nfit(-160, -160, 320, 320)\n\nanimate((t, dt) => {\n  const r = slider('wheel radius', 10, 110, 45, 1)\n  const d = slider('pen distance', 0, 110, 70, 1)\n  const speed = slider('speed', 0, 10, 3, 0.1)\n\n  const period = 2 * PI * (r / gcd(R, r))\n  s = (s + speed * dt) % (period * 1.5)\n\n  const k = (R - r) / r\n  const penX = (u) => (R - r) * cos(u) + d * cos(k * u)\n  const penY = (u) => (R - r) * sin(u) - d * sin(k * u)\n\n  clear()\n  circle(0, 0, R, false, 'rgba(255, 255, 255, 0.2)', px(1))\n  plotParam(penX, penY, hsl(s * 15, 85, 65), px(2), 0, min(s, period))\n\n  if (s < period) {\n    const wheelX = (R - r) * cos(s)\n    const wheelY = (R - r) * sin(s)\n    circle(wheelX, wheelY, r, false, 'rgba(255, 255, 255, 0.5)', px(1))\n    line(wheelX, wheelY, penX(s), penY(s), 'white', px(1))\n    point(penX(s), penY(s), 'white', 8)\n  }\n})\n"},{id:"fourier",title:"Fourier series",group:"Math",description:"circle, line, polyline: a square wave from circles.",code:"// A square wave built from circles: each one adds the next odd harmonic.\nconst R = 70\nconst wave = []\nfit(-110, -110, 420, 220)\n\nanimate((t) => {\n  const terms = slider('terms', 1, 20, 4, 1)\n\n  clear()\n  let x = 0\n  let y = 0\n  for (let i = 0; i < terms; i++) {\n    const n = 2 * i + 1\n    const r = (4 * R) / (n * PI)\n    const [nx, ny] = add([x, y], polar(r, n * t))\n    circle(x, y, r, false, 'rgba(255, 255, 255, 0.25)', px(1))\n    line(x, y, nx, ny, 'white', px(1))\n    x = nx\n    y = ny\n  }\n\n  wave.unshift(y)\n  if (wave.length > 200) {\n    wave.pop()\n  }\n\n  line(x, y, 110, y, palette(3), px(1))\n  polyline(wave.map((v, i) => [110 + i, v]), palette(2), px(2))\n})\n"},{id:"waves",title:"Wave interference",group:"Math",description:"heat, drag, colorbar: two wave sources you can move.",code:"// Two wave sources interfering. Drag the sources around.\nfit(-120, -90, 240, 180)\n\nanimate((t) => {\n  const wavelength = slider('wavelength', 15, 80, 35)\n  const a = drag('a', -40, 0, 8, palette(0))\n  const b = drag('b', 40, 0, 8, palette(1))\n\n  const k = (2 * PI) / wavelength\n  const wave = ([sx, sy], x, y) => sin(k * hypot(x - sx, y - sy) - t * 4)\n\n  heat((x, y) => 0.5 + 0.25 * (wave(a, x, y) + wave(b, x, y)), 'coolwarm')\n  colorbar('coolwarm', -2, 2, 'height')\n})\n"},{id:"pendulum",title:"Double pendulum",group:"Math",description:"trail, pause, step: two linked arms going chaotic.",code:"// A double pendulum: two linked arms whose motion quickly turns chaotic.\nconst L = 100\nconst g = 9.81\nlet a1, a2, w1, w2\n\nfunction restart() {\n  a1 = PI / 2 + random(-0.2, 0.2)\n  a2 = PI / 2 + random(-0.2, 0.2)\n  w1 = 0\n  w2 = 0\n}\n\n// Angular accelerations for equal masses and arm lengths.\nfunction accel(a1, a2, w1, w2) {\n  const d = a1 - a2\n  const den = 3 - cos(2 * d)\n  return [\n    (-3 * g * sin(a1) - g * sin(a1 - 2 * a2) - 2 * sin(d) * (w2 * w2 + w1 * w1 * cos(d))) / den,\n    (2 * sin(d) * (2 * w1 * w1 + 2 * g * cos(a1) + w2 * w2 * cos(d))) / den\n  ]\n}\n\nrestart()\nfit(-230, -230, 460, 460)\n\nanimate((t, dt) => {\n  if (button('restart')) {\n    restart()\n  }\n  pause(toggle('pause'))\n  if (button('step')) {\n    step()\n  }\n\n  const h = min(dt, 0.05) / 20\n  for (let i = 0; i < 20; i++) {\n    const [e1, e2] = accel(a1, a2, w1, w2)\n    w1 += e1 * h\n    w2 += e2 * h\n    a1 += w1 * h\n    a2 += w2 * h\n  }\n\n  const x1 = L * sin(a1)\n  const y1 = -L * cos(a1)\n  const x2 = x1 + L * sin(a2)\n  const y2 = y1 - L * cos(a2)\n\n  clear()\n  trail('tip', x2, y2, palette(5), 400)\n  line(0, 0, x1, y1, 'white', 3)\n  line(x1, y1, x2, y2, 'white', 3)\n  circle(0, 0, 4, '#aab0c4')\n  circle(x1, y1, 10, palette(0))\n  circle(x2, y2, 10, palette(5))\n})\n"},{id:"bezier",title:"Bezier curve",group:"Math",description:"drag, bezier, vectors: drag the control points.",code:"// A cubic Bezier curve. Drag the control points; move the slider to see how\n// repeated in-between points find the point on the curve.\nconst P = [\n  drag('p0', -150, -60, 8, palette(0)),\n  drag('p1', -80, 90, 8, palette(1)),\n  drag('p2', 80, 90, 8, palette(2)),\n  drag('p3', 150, -60, 8, palette(3))\n]\nconst t = slider('t', 0, 1, 0.4, 0.01)\n\n// The point t of the way from a to b, and one such point on every segment.\nconst between = (a, b, t) => add(a, scale(sub(b, a), t))\nconst reduce = (pts, t) => pts.slice(1).map((p, i) => between(pts[i], p, t))\n\nclear()\ngrid(20, null, 100)\npolyline(P, { color: 'rgba(255, 255, 255, 0.4)', width: px(1), dash: [4, 4] })\nbezier(...P[0], ...P[1], ...P[2], ...P[3], 'white', px(2.5))\n\nlet pts = reduce(P, t)\nfor (let level = 0; pts.length > 1; level++) {\n  polyline(pts, hsl(200 + level * 50, 80, 65), px(1.5))\n  points(pts, hsl(200 + level * 50, 80, 65), 7)\n  pts = reduce(pts, t)\n}\nconst [x, y] = pts[0]\npoint(x, y, palette(5), 12)\n\nfit(-200, -120, 400, 260)\n"},{id:"triangle",title:"Triangle centers",group:"Math",description:"drag, vectors, label: drag the corners and watch the Euler line.",code:"// Drag the corners: the centroid G, circumcenter O and orthocenter H\n// always lie on one line, the Euler line.\nconst A = drag('A', -120, -70, 9, palette(0))\nconst B = drag('B', 130, -50, 9, palette(1))\nconst C = drag('C', -10, 110, 9, palette(2))\n\nfunction circumcenter([ax, ay], [bx, by], [cx, cy]) {\n  const d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by))\n  const a2 = ax * ax + ay * ay\n  const b2 = bx * bx + by * by\n  const c2 = cx * cx + cy * cy\n  return [\n    (a2 * (by - cy) + b2 * (cy - ay) + c2 * (ay - by)) / d,\n    (a2 * (cx - bx) + b2 * (ax - cx) + c2 * (bx - ax)) / d\n  ]\n}\n\nconst G = scale(add(add(A, B), C), 1 / 3)\nconst O = circumcenter(A, B, C)\nconst H = sub(scale(G, 3), scale(O, 2))\n\nclear()\ngrid(20, null, 100)\npoly([A, B, C], 'rgba(91, 108, 240, 0.15)', 'white', px(2))\ncircle(...O, dist(A, O), false, palette(3), px(1))\nline(...O, ...H, { color: 'rgba(255, 255, 255, 0.5)', width: px(1), dash: [6, 4] })\n\nfor (const [name, p, color] of [['G', G, palette(5)], ['O', O, palette(3)], ['H', H, palette(6)]]) {\n  point(...p, color, px(9))\n  label(name, ...add(p, [px(8), px(8)]), color, 13)\n}\n\nfit(-200, -150, 400, 300)\n"},{id:"phase",title:"Phase portrait",group:"Math",description:"field, trail, axes labels: a damped pendulum in the (theta, omega) plane.",code:"// Phase portrait of a damped pendulum: angle theta across, speed omega up.\n// Click to drop a particle.\nconst S = 40\nconst particles = [[-3, 2], [-1, 3], [2, -2.5], [3, 1], [0.5, -1], [-2.5, -1]].map(([th, om]) => ({ th, om }))\n\nfit(-6.5 * S, -4 * S, 13 * S, 8 * S)\n\nanimate((t, dt) => {\n  const damping = slider('damping', 0, 1, 0.2, 0.01)\n  const accel = (th, om) => -sin(th) - damping * om\n\n  if (mouse.clicked && particles.length < 40) {\n    particles.push({ th: mouse.x / S, om: mouse.y / S })\n  }\n\n  clear()\n  grid(S / 2, null, S)\n  axes({ xLabel: 'theta', yLabel: 'omega', step: S })\n  field((x, y) => [(y / S) * 12, accel(x / S, y / S) * 12], 20, 'rgba(91, 108, 240, 0.6)')\n\n  const h = min(dt, 0.05) / 4\n  particles.forEach((p, i) => {\n    for (let k = 0; k < 4; k++) {\n      p.om += accel(p.th, p.om) * h\n      p.th += p.om * h\n    }\n    trail('p' + i, p.th * S, p.om * S, palette(i + 1), 150)\n    point(p.th * S, p.om * S, palette(i + 1), 8)\n  })\n})\n"},{id:"flow",title:"Flow field",group:"Math",description:"field, random: particles streaming through a swirling vector field.",code:"// Particles streaming through a swirling vector field.\nfit(-300, -200, 600, 400)\n\nconst spawn = (p) =>\n  Object.assign(p, {\n    x: random(view.left, view.right),\n    y: random(view.bottom, view.top),\n    life: random(1, 4)\n  })\nconst outside = (p) => p.x < view.left || p.x > view.right || p.y < view.bottom || p.y > view.top\nconst particles = range(500).map(() => spawn({}))\n\nanimate((t, dt) => {\n  const arrows = toggle('arrows', false)\n  const flow = (x, y) => [40 * sin(y / 50 + t / 2), 40 * cos(x / 50 - t / 2)]\n\n  clear()\n  if (arrows) {\n    field(flow, 30, 'rgba(91, 108, 240, 0.5)')\n  }\n\n  for (const p of particles) {\n    const [vx, vy] = flow(p.x, p.y)\n    const hue = (angle([vx, vy]) * 180) / PI + 200\n    line(p.x - vx * 0.15, p.y - vy * 0.15, p.x, p.y, hsl(hue, 80, 65, min(1, p.life)), px(2))\n\n    p.x += vx * min(dt, 0.05)\n    p.y += vy * min(dt, 0.05)\n    p.life -= dt\n    if (p.life < 0 || outside(p)) {\n      spawn(p)\n    }\n  }\n})\n"},{id:"mandelbrot",title:"Mandelbrot set",group:"Math",description:"heat, select: smooth escape-time coloring.",code:"// The Mandelbrot set. Pan and zoom to explore.\nconst ramp = select('ramp', ['magma', 'inferno', 'plasma', 'turbo', 'viridis', 'cividis', 'hot', 'vexel', 'gray'])\nconst maxIter = slider('iterations', 20, 300, 80, 1)\nconst cell = slider('cell size', 1, 12, 3, 1)\nconst unit = 200   // world units per 1 on the complex plane\n\n// Smooth escape time of c = cr + ci i, or maxIter if it never escapes.\nfunction escape(cr, ci) {\n  let zr = 0\n  let zi = 0\n  for (let n = 0; n < maxIter; n++) {\n    const zr2 = zr * zr\n    const zi2 = zi * zi\n    if (zr2 + zi2 > 256) {\n      return n + 1 - log2(Math.log(zr2 + zi2) / 2)\n    }\n    zi = 2 * zr * zi + ci\n    zr = zr2 - zi2 + cr\n  }\n  return maxIter\n}\n\nclear()\nheat((x, y) => {\n  const n = escape(x / unit - 0.5, y / unit)\n  return n >= maxIter ? 0 : sqrt(max(0, n) / maxIter)\n}, ramp, cell)\n"},{id:"metaballs",title:"Metaballs",group:"Math",description:"heat + contour: an implicit curve around moving blobs and the pointer.",code:"// Metaballs: blobs that melt together as they move. One follows the pointer.\nfit(-250, -170, 500, 340)\n\nanimate((t) => {\n  const level = slider('threshold', 0.3, 3, 1, 0.1)\n  const ramp = select('ramp', ['magma', 'plasma', 'vexel', 'turbo', 'cividis'])\n\n  const blobs = [\n    [120 * cos(t * 0.7), 80 * sin(t * 0.9), 60],\n    [-100 * sin(t * 0.5), 60 * cos(t * 0.8), 50],\n    [80 * cos(t * 0.4 + 2), -90 * sin(t * 0.6), 70],\n    [mouse.x, mouse.y, 45]\n  ]\n  const strength = (x, y) =>\n    blobs.reduce((sum, [bx, by, r]) => sum + (r * r) / ((x - bx) ** 2 + (y - by) ** 2 + 1), 0)\n\n  clear()\n  heat((x, y) => min(1, strength(x, y) / 3), ramp)\n  contour(strength, level, 'white', px(2))\n  contour(strength, level * 2, 'rgba(255, 255, 255, 0.4)', px(1))\n})\n"},{id:"heatmap",title:"Heatmap from data",group:"Data",description:"grid2d, ramp, textBox, hover: a grid of [column, row, value] triples.",code:"// A heatmap from [column, row, value] data. Hover a cell to read its value.\nconst cols = 14\nconst rows = 9\nconst cell = 36\n\nconst data = grid2d(cols, rows, (c, r) => [c, r, round(50 + 40 * sin(c / 2.2) * cos(r / 1.7) + 10 * sin(c * r))])\nconst values = data.map(([c, r, v]) => v)\nconst shade = normalize(values)\n\nclear()\nfit(0, 0, cols * cell, rows * cell)\n\nlet hovered = null\ndata.forEach(([c, r, v], i) => {\n  const x = c * cell\n  const y = r * cell\n  rect(x, y, cell - 2, cell - 2, ramp('plasma', shade[i]))\n  if (hover(x + cell / 2, y + cell / 2, cell / 2)) {\n    hovered = [c, r, v]\n  }\n})\n\n// The tooltip goes last so no cell covers it.\nif (hovered) {\n  const [c, r, v] = hovered\n  rect(c * cell, r * cell, cell - 2, cell - 2, false, 'white', px(2))\n  textBox('column ' + c + '\\nrow ' + r + '\\nvalue ' + v, (c + 1) * cell, r * cell)\n}\ncolorbar('plasma', min(...values), max(...values))\n"},{id:"charts",title:"Bars and histogram",group:"Data",description:"bars, hist, transform: charts from plain arrays.",code:"// A histogram of random samples, and a bar chart next to it.\nconst bins = slider('bins', 5, 40, 20, 1)\nconst samples = range(600).map(() => gauss(100, 30))\nconst sales = [30, 80, 55, 95, 60]\n\nclear()\ngrid(10, null, 50)\naxes()\n\nhist(samples, bins, palette(0))\ntext('600 samples', 100, 120, 'white', 10, 'center')\n\n// transform shifts the bar chart 260 units right; its own coordinates stay simple.\ntransform(() => {\n  bars(sales, 20, (i) => palette(i))\n  sales.forEach((v, i) => text(v, i * 20 + 10, v + 6, 'white', 8, 'center'))\n}, { x: 260 })\n\nfit(-10, -20, 390, 150)\n"},{id:"scatter",title:"Scatter plot",group:"Data",description:"scatter, random, gauss: a spiral galaxy of dots colored by value.",code:"// A two-armed spiral galaxy, colored by distance from the core.\nconst ramp = select('ramp', ['turbo', 'viridis', 'plasma', 'inferno', 'cividis', 'hot', 'coolwarm', 'vexel', 'gray'])\nconst count = slider('stars', 200, 4000, 2000, 50)\nconst twist = slider('twist', 0, 6, 3, 0.1)\n\nconst stars = range(count).map((i) => {\n  const r = 200 * random() ** 1.5\n  const a = (i % 2) * PI + (twist * r) / 200 + gauss(0, 0.35)\n  return [cos(a) * r + gauss(0, 6), sin(a) * r + gauss(0, 6), 1 - r / 200]\n})\n\nclear()\nscatter(stars, ramp, 3)\nfit(...bounds(stars))\n"},{id:"csv",title:"CSV explorer",group:"Data",description:"file, select, axes: drop a CSV and plot any two columns.",code:"// Drop a CSV file onto the preview, or click \"data\" in the panel, then pick two columns.\n// Until then it shows a made-up weather sample.\nconst sample = range(120).map((day) => ({\n  day,\n  temp: round(12 + 9 * sin(day / 19) + gauss(0, 1.5), 1),\n  rain: round(max(0, gauss(2, 3)), 1),\n  wind: round(abs(gauss(15, 6)), 1)\n}))\nsample.columns = ['day', 'temp', 'rain', 'wind']\n\nconst rows = file('data') ?? sample\nif (!rows.columns) {\n  return hud('that file is not a table: try a CSV or TSV file')\n}\n\n// Only columns with numbers can be plotted.\nconst numeric = rows.columns.filter((c) => rows.some((r) => typeof r[c] === 'number'))\nif (numeric.length < 2) {\n  return hud('need at least two columns with numbers')\n}\nconst xCol = select('x', numeric, numeric[0])\nconst yCol = select('y', numeric, numeric[1])\nconst style = select('style', ['dots', 'line'])\n\nconst pts = rows\n  .filter((r) => typeof r[xCol] === 'number' && typeof r[yCol] === 'number')\n  .map((r) => [r[xCol], r[yCol]])\n\nclear()\naxes({ xLabel: xCol, yLabel: yCol })\nif (style === 'line') {\n  polyline(pts, palette(0), px(2))\n} else {\n  points(pts, palette(0), px(6))\n}\nfit(...bounds(pts))\n"},{id:"donut",title:"Donut chart",group:"Data",description:"poly, polar, linspace: slices that pop out on hover.",code:"// A donut chart. Hover a slice to pull it out.\nconst data = [\n  ['Rent', 1200],\n  ['Food', 450],\n  ['Transport', 180],\n  ['Fun', 220],\n  ['Savings', 500]\n]\nconst total = data.reduce((sum, [label, value]) => sum + value, 0)\n\n// Turns go clockwise from the top: 0 is 12 o'clock, 0.25 is 3 o'clock.\nconst turnAngle = (turn) => PI / 2 - turn * 2 * PI\n\n// A ring segment between two turns, shifted by offset.\nfunction slice(from, to, inner, outer, offset) {\n  const ring = (r, a, b) => linspace(a, b, 40).map((turn) => add(offset, polar(r, turnAngle(turn))))\n  return [...ring(outer, from, to), ...ring(inner, to, from)]\n}\n\nfit(-220, -150, 440, 300)\n\nanimate(() => {\n  const mouseTurn = (turnAngle(0) - angle([mouse.x, mouse.y])) / (2 * PI)\n  const pointerTurn = mouseTurn - floor(mouseTurn)\n  const pointerR = len([mouse.x, mouse.y])\n\n  clear()\n  let from = 0\n  data.forEach(([label, value], i) => {\n    const to = from + value / total\n    const hovered = pointerR > 60 && pointerR < 110 && pointerTurn >= from && pointerTurn < to\n    const mid = turnAngle((from + to) / 2)\n    const offset = polar(hovered ? 10 : 0, mid)\n\n    poly(slice(from, to, 60, 110, offset), palette(i), '#282c34', px(2))\n    const percent = round((value / total) * 100) + '%'\n    text(label + ' ' + percent, ...polar(130, mid), hovered ? 'white' : '#aab0c4', 12, cos(mid) >= 0 ? 'left' : 'right')\n    if (hovered) {\n      text(value, 0, 0, 'white', 22, 'center')\n    }\n    from = to\n  })\n})\n"},{id:"sort",title:"Bubble sort",group:"Data",description:"bars, button, random: watch a list get sorted.",code:"// Bubble sort: compare neighbors and swap them until every bar is in order.\nconst N = 40\nlet values, pass, j, done\n\nfunction shuffle() {\n  values = range(N).map(() => round(random(5, 100)))\n  pass = 0\n  j = 0\n  done = false\n}\n\nfunction compare() {\n  if (done) {\n    return\n  }\n  if (values[j] > values[j + 1]) {\n    [values[j], values[j + 1]] = [values[j + 1], values[j]]\n  }\n  j++\n  if (j >= N - 1 - pass) {\n    j = 0\n    pass++\n  }\n  done = pass >= N - 1\n}\n\nfunction barColor(i) {\n  if (done || i >= N - pass) {\n    return palette(2)\n  }\n  if (i === j || i === j + 1) {\n    return palette(3)\n  }\n  return '#566079'\n}\n\nshuffle()\nfit(-10, -15, N * 10 + 200, 130)\n\nanimate(() => {\n  const speed = slider('steps per frame', 1, 50, 5, 1)\n  if (button('shuffle')) {\n    shuffle()\n  }\n  for (let k = 0; k < speed; k++) {\n    compare()\n  }\n\n  clear()\n  bars(values, 10, barColor)\n  text(done ? 'sorted!' : 'pass ' + (pass + 1), 0, -8, '#aab0c4', 10)\n})\n"},{id:"tree",title:"Fractal tree",group:"Generative",description:"line, polar, mix: a recursive tree swaying in the wind.",code:"// A fractal tree: every branch splits into two smaller ones.\nfit(-200, -160, 400, 330)\n\nanimate((t) => {\n  const depth = slider('depth', 1, 12, 9, 1)\n  const spread = slider('spread', 0, 90, 25, 1)\n  const shrink = slider('shrink', 0.5, 0.85, 0.72, 0.01)\n  const wind = slider('wind', 0, 1, 0.3, 0.01)\n\n  function branch(x, y, angle, length, level) {\n    const k = level / depth\n    const [x2, y2] = add([x, y], polar(length, angle))\n    line(x, y, x2, y2, mix('#7a4a2a', '#6fd36f', k), max(1, (depth - level) * 1.5))\n    if (level >= depth) {\n      return\n    }\n\n    const turn = (spread * PI) / 180\n    const sway = wind * 0.05 * sin(t * 1.5 + level)\n    branch(x2, y2, angle + turn + sway, length * shrink, level + 1)\n    branch(x2, y2, angle - turn + sway, length * shrink, level + 1)\n  }\n\n  clear()\n  branch(0, -150, PI / 2, 90, 1)\n})\n"},{id:"terrain",title:"Noise terrain",group:"Generative",description:"noise, heat, mix: an endless map from layered Perlin noise.",code:"// A map from layered Perlin noise. Pan around: the land goes on forever.\nconst size = slider('feature size', 50, 400, 150)\nconst layers = slider('layers', 1, 6, 4, 1)\nconst sea = slider('sea level', 0, 1, 0.5, 0.01)\nseed(slider('seed', 1, 100, 1, 1))\n\n// Several layers of noise, each twice as fine and half as strong.\nfunction height(x, y) {\n  let sum = 0\n  let total = 0\n  for (let i = 0; i < layers; i++) {\n    const k = 2 ** i\n    sum += noise((x * k) / size, (y * k) / size, i * 10) / k\n    total += 1 / k\n  }\n  // Noise mostly stays near 0.5, so stretch it to use the whole 0..1 range.\n  return clamp(0.5 + (sum / total - 0.5) * 2.5)\n}\n\n// Height (0..1) to a map color: deep to shallow water, beach, forest, rock and snow.\nfunction terrain(h) {\n  if (h < sea) {\n    return mix('#0f2f5c', '#3f8fd0', h / sea)\n  }\n  const land = (h - sea) / (1 - sea)\n  if (land < 0.05) {\n    return '#d8c88e'\n  }\n  if (land < 0.6) {\n    return mix('#5aa34f', '#2b5a2b', land / 0.6)\n  }\n  return land < 0.85 ? '#7a6a5a' : '#f2f2f2'\n}\n\nclear()\nheat(height, terrain)\n"},{id:"walk",title:"Random walks",group:"Generative",description:"random, seed, polyline: wandering paths.",code:"// Random walks: each step goes the same distance in a random direction.\nconst walkers = slider('walkers', 1, 12, 6, 1)\nconst steps = slider('steps', 100, 3000, 1000, 100)\nseed(slider('seed', 1, 100, 1, 1))\n\nclear()\ngrid(50, null, 250)\n\nfor (let w = 0; w < walkers; w++) {\n  let p = [0, 0]\n  const path = [p]\n  for (let i = 0; i < steps; i++) {\n    p = add(p, polar(5, random(2 * PI)))\n    path.push(p)\n  }\n  polyline(path, hsl(w * 30, 80, 65, 0.7), px(1.5))\n  point(...p, hsl(w * 30, 80, 65), 8)\n}\n\npoint(0, 0, 'white', 10)\nfit(-250, -250, 500, 500)\n"},{id:"stars",title:"Starfield",group:"Generative",description:"line, random: flying through space.",code:"// Flying through a field of stars.\nconst stars = range(400).map(() => ({ x: random(-1, 1), y: random(-1, 1), z: random() }))\nconst project = (s, z) => [(s.x / z) * 150, (s.y / z) * 150]\n\nfit(-200, -150, 400, 300)\n\nanimate((t, dt) => {\n  const speed = slider('speed', 0, 2, 0.4, 0.01)\n\n  clear()\n  for (const s of stars) {\n    const [x0, y0] = project(s, s.z)\n    s.z -= speed * dt\n    if (s.z < 0.02) {\n      Object.assign(s, { x: random(-1, 1), y: random(-1, 1), z: 1 })\n      continue\n    }\n    const [x1, y1] = project(s, s.z)\n    const near = 1 - s.z\n    line(x0, y0, x1, y1, hsl(220, 60, 50 + near * 45, near), px(0.5 + near * 3))\n  }\n})\n"},{id:"koch",title:"Koch snowflake",group:"Generative",description:"poly, vectors, number: a fractal edge.",code:"// The Koch snowflake: replace the middle third of every edge with a spike, again and again.\nconst depth = number('depth', 4, 1, 0, 6)\n\n// Points from a toward b, not including b.\nfunction koch(a, b, level) {\n  if (level === 0) {\n    return [a]\n  }\n  const third = scale(sub(b, a), 1 / 3)\n  const p1 = add(a, third)\n  const p3 = add(p1, third)\n  const p2 = add(p1, rot(third, -PI / 3))\n  return [...koch(a, p1, level - 1), ...koch(p1, p2, level - 1), ...koch(p2, p3, level - 1), ...koch(p3, b, level - 1)]\n}\n\nconst corners = [90, 210, 330].map((deg) => polar(120, (deg * PI) / 180))\nconst outline = corners.flatMap((c, i) => koch(c, corners[(i + 1) % 3], depth))\n\nclear()\npoly(outline, 'rgba(91, 108, 240, 0.25)', '#9fb4ff', px(1.5))\nhud(outline.length + ' edges')\nfit(-160, -130, 320, 300)\n"},{id:"keys",title:"Collect the coins",group:"Interactive",description:"key, random, ellipse: a tiny arrow-key game.",code:"// Collect the coins with the arrow keys or WASD. Click the preview first.\nconst place = () => [random(-260, 260), random(-170, 170)]\nconst axis = (plus, minus) => (plus ? 1 : 0) - (minus ? 1 : 0)\n\nlet x = 0\nlet y = 0\nlet score = 0\nlet coins = range(5).map(place)\n\nfit(-300, -200, 600, 400)\n\nanimate((t, dt) => {\n  const speed = slider('speed', 50, 400, 220)\n  every(10, () => coins.push(place()))\n\n  const step = speed * min(dt, 0.1)\n  x = clamp(x + axis(key('ArrowRight') || key('d'), key('ArrowLeft') || key('a')) * step, -290, 290)\n  y = clamp(y + axis(key('ArrowUp') || key('w'), key('ArrowDown') || key('s')) * step, -190, 190)\n\n  coins = coins.map((coin) => {\n    if (dist(coin, [x, y]) > 20) {\n      return coin\n    }\n    score++\n    return place()\n  })\n\n  clear()\n  grid(20, null, 100)\n  rect(-300, -200, 600, 400, false, 'rgba(255, 255, 255, 0.4)', px(2))\n  coins.forEach(([cx, cy], i) => {\n    const spin = abs(cos(t * 3 + i))\n    ellipse(cx, cy, 8 * spin + 1, 8, hsl(45, 95, 55), hsl(35, 90, 40), px(1.5))\n  })\n  trail('me', x, y, palette(1), 60)\n  circle(x, y, 12, palette(0), 'white', px(2))\n  hud('score: ' + score)\n})\n"},{id:"mines",title:"Mines",group:"Interactive",description:"mouse.clicked, grid2d, key, lockView: a minesweeping puzzle.",code:"// Open every safe cell without hitting a mine. Numbers count the mines around.\n// Click to open a cell; hold F or Shift while clicking to flag it.\nconst W = 12\nconst H = 10\nconst MINES = 18\nconst S = 20\nconst COLORS = ['', '#6c8cff', '#5fd38d', '#ff6b6b', '#b48cff', '#ffb547', '#4fd6d6', '#e6e8f0', '#9aa0b4']\n\nlet cells, started, over, won\n\nfunction newGame() {\n  cells = grid2d(W, H, (x, y) => ({ x, y, mine: false, open: false, flag: false, n: 0 }))\n  started = over = won = false\n}\n\nconst at = (x, y) => (x >= 0 && y >= 0 && x < W && y < H ? cells[y * W + x] : null)\n\nfunction neighbors(c) {\n  const out = []\n  for (let dy = -1; dy <= 1; dy++) {\n    for (let dx = -1; dx <= 1; dx++) {\n      const n = (dx || dy) && at(c.x + dx, c.y + dy)\n      if (n) {\n        out.push(n)\n      }\n    }\n  }\n  return out\n}\n\n// Mines are placed after the first click, away from it, so it is always safe.\nfunction plant(first) {\n  const free = cells.filter((c) => c !== first && !neighbors(first).includes(c))\n  for (let k = 0; k < MINES; k++) {\n    free.splice(floor(Math.random() * free.length), 1)[0].mine = true\n  }\n  cells.forEach((c) => (c.n = neighbors(c).filter((o) => o.mine).length))\n}\n\nfunction reveal(c) {\n  if (c.open || c.flag) {\n    return\n  }\n  c.open = true\n  if (c.mine) {\n    over = true\n  } else if (c.n === 0) {\n    neighbors(c).forEach(reveal)\n  }\n}\n\nfunction cellColor(c, hovered) {\n  if (c.open || (over && c.mine)) {\n    return c.mine ? '#c0392b' : '#353a47'\n  }\n  return c === hovered && !over ? '#6f7a99' : '#566079'\n}\n\nnewGame()\nlockView()\nfit(-S, -S * 1.5, (W + 2) * S + 150, (H + 3) * S)\n\nanimate(() => {\n  if (button('new game')) {\n    newGame()\n  }\n\n  const hovered = at(floor(mouse.x / S), floor(mouse.y / S))\n  if (mouse.clicked && hovered && !over) {\n    if (key('f') || key('Shift')) {\n      if (!hovered.open) {\n        hovered.flag = !hovered.flag\n      }\n    } else {\n      if (!started) {\n        plant(hovered)\n      }\n      started = true\n      reveal(hovered)\n      won = !over && cells.every((c) => c.mine || c.open)\n      over = over || won\n    }\n  }\n\n  clear()\n  for (const c of cells) {\n    const X = c.x * S\n    const Y = c.y * S\n    rect(X + 1, Y + 1, S - 2, S - 2, cellColor(c, hovered))\n    if ((c.open || over) && c.mine) {\n      circle(X + S / 2, Y + S / 2, 5, '#14161b')\n    } else if (c.open && c.n) {\n      text(c.n, X + S / 2, Y + S / 2, COLORS[c.n], 13, 'center')\n    } else if (c.flag) {\n      poly([[X + 6, Y + 4], [X + 6, Y + 16], [X + 15, Y + 12]], '#ff6b6b')\n    }\n  }\n\n  const flags = cells.filter((c) => c.flag).length\n  text('mines left ' + (MINES - flags), 0, -S * 0.8, '#e6e8f0', 12)\n  if (won) {\n    text('Cleared!', W * S, -S * 0.8, '#5fd38d', 12, 'right')\n  } else if (over) {\n    text('Boom! Press new game.', W * S, -S * 0.8, '#ff6b6b', 12, 'right')\n  }\n})\n"},{id:"life",title:"Game of Life",group:"Interactive",description:"every, grid2d, button, mouse.clicked: cells that live and die.",code:"// Conway's Game of Life. Click cells to flip them.\nconst W = 40\nconst H = 26\nconst S = 10\n\nconst randomCells = () => grid2d(W, H, () => random() < 0.25)\nlet cells = randomCells()\n\nconst alive = (x, y) => cells[((y + H) % H) * W + ((x + W) % W)]\n\nfunction neighbors(x, y) {\n  let n = 0\n  for (let dy = -1; dy <= 1; dy++) {\n    for (let dx = -1; dx <= 1; dx++) {\n      if ((dx || dy) && alive(x + dx, y + dy)) {\n        n++\n      }\n    }\n  }\n  return n\n}\n\nfunction advance() {\n  cells = cells.map((on, i) => {\n    const n = neighbors(i % W, floor(i / W))\n    return n === 3 || (on && n === 2)\n  })\n}\n\nlockView()\nfit(-S, -S, W * S + 220, H * S + 2 * S)\n\nanimate(() => {\n  const playing = toggle('play', true)\n  const speed = slider('steps per second', 1, 30, 10, 1)\n  if (button('step')) {\n    advance()\n  }\n  if (button('randomize')) {\n    cells = randomCells()\n  }\n  if (button('clear')) {\n    cells = cells.map(() => false)\n  }\n  if (playing) {\n    every(1 / speed, advance)\n  }\n\n  const x = floor(mouse.x / S)\n  const y = floor(mouse.y / S)\n  if (mouse.clicked && x >= 0 && y >= 0 && x < W && y < H) {\n    cells[y * W + x] = !cells[y * W + x]\n  }\n\n  clear()\n  rect(0, 0, W * S, H * S, '#1d2027')\n  cells.forEach((on, i) => {\n    if (on) {\n      rect((i % W) * S + 0.5, floor(i / W) * S + 0.5, S - 1, S - 1, palette(2))\n    }\n  })\n})\n"},{id:"snake",title:"Snake",group:"Interactive",description:"key, slider, lockView: a grid snake with fixed-step movement.",code:"// Steer with the arrow keys or WASD, eat the food, avoid walls and your own tail.\n// Click the preview first. Space restarts.\nconst W = 24\nconst H = 16\nconst S = 20\n\nlet snake, dir, next, food, score, over, timer\n\nconst same = (a, b) => a[0] === b[0] && a[1] === b[1]\nconst outside = ([x, y]) => x < 0 || y < 0 || x >= W || y >= H\n\nfunction placeFood() {\n  do {\n    food = [floor(Math.random() * W), floor(Math.random() * H)]\n  } while (snake.some((part) => same(part, food)))\n}\n\nfunction newGame() {\n  snake = [[6, 8], [5, 8], [4, 8]]\n  dir = next = [1, 0]\n  score = 0\n  over = false\n  timer = 0\n  placeFood()\n}\n\nfunction move() {\n  if (!same(next, [-dir[0], -dir[1]])) {\n    dir = next\n  }\n  const head = [snake[0][0] + dir[0], snake[0][1] + dir[1]]\n  const grows = same(head, food)\n  const body = grows ? snake : snake.slice(0, -1)\n  if (outside(head) || body.some((part) => same(part, head))) {\n    over = true\n    return\n  }\n  snake = [head, ...body]\n  if (grows) {\n    score++\n    placeFood()\n  }\n}\n\nnewGame()\nlockView()\nfit(-S, -S * 2, (W + 2) * S + 160, (H + 3) * S)\n\nanimate((t, dt) => {\n  const speed = slider('speed', 4, 20, 9, 1)\n  if (over && key('Space')) {\n    newGame()\n  }\n\n  if (key('ArrowUp') || key('w')) {\n    next = [0, 1]\n  }\n  if (key('ArrowDown') || key('s')) {\n    next = [0, -1]\n  }\n  if (key('ArrowLeft') || key('a')) {\n    next = [-1, 0]\n  }\n  if (key('ArrowRight') || key('d')) {\n    next = [1, 0]\n  }\n\n  timer += min(dt, 0.25)\n  while (!over && timer >= 1 / speed) {\n    timer -= 1 / speed\n    move()\n  }\n\n  clear()\n  rect(0, 0, W * S, H * S, '#262a35', '#5b6cf0', px(2))\n  circle(food[0] * S + S / 2, food[1] * S + S / 2, 6 + sin(t * 8), '#ff6b6b')\n  snake.forEach(([x, y], i) => {\n    const k = i / snake.length\n    rect(x * S + 1, y * S + 1, S - 2, S - 2, hsl(140 + k * 40, 70, lerp(60, 35, k)))\n  })\n\n  text('score ' + score, 0, -S, '#e6e8f0', 13)\n  if (over) {\n    text('Game over! Press Space to play again.', W * S, -S, '#ff6b6b', 13, 'right')\n  }\n})\n"},{id:"pong",title:"Pong",group:"Interactive",description:"mouse, lockView: paddle versus computer.",code:"// Pong against the computer. Move your paddle (left) with the mouse.\nconst W = 300\nconst H = 180\nconst PADDLE = 40\nconst R = 6\nlet ball\nlet cpuY = 0\nlet you = 0\nlet cpu = 0\n\nfunction serve(direction) {\n  ball = { x: 0, y: 0, vx: 220 * direction, vy: random(-120, 120) }\n}\n\nfunction bounceOff(paddleY, x) {\n  if (abs(ball.y - paddleY) > PADDLE + R) {\n    return\n  }\n  ball.x = x\n  ball.vx = clamp(-ball.vx * 1.05, -600, 600)\n  ball.vy += (ball.y - paddleY) * 4\n}\n\nserve(1)\nlockView()\nfit(-W - 20, -H - 40, 2 * W + 40, 2 * H + 60)\n\nanimate((t, dt) => {\n  dt = min(dt, 0.05)\n  const youY = clamp(mouse.y, -H + PADDLE, H - PADDLE)\n  cpuY += clamp(ball.y - cpuY, -160 * dt, 160 * dt)\n\n  ball.x += ball.vx * dt\n  ball.y += ball.vy * dt\n  if (abs(ball.y) > H - R) {\n    ball.y = sign(ball.y) * (H - R)\n    ball.vy = -ball.vy\n  }\n  if (ball.vx < 0 && ball.x < -W + 16 + R) {\n    bounceOff(youY, -W + 16 + R)\n  }\n  if (ball.vx > 0 && ball.x > W - 16 - R) {\n    bounceOff(cpuY, W - 16 - R)\n  }\n  if (ball.x < -W - 20) {\n    cpu++\n    serve(1)\n  }\n  if (ball.x > W + 20) {\n    you++\n    serve(-1)\n  }\n\n  clear()\n  rect(-W, -H, 2 * W, 2 * H, false, '#5b6cf0', px(2))\n  for (let y = -H + 10; y < H; y += 20) {\n    line(0, y, 0, y + 10, 'rgba(255, 255, 255, 0.2)', 2)\n  }\n  rect(-W + 8, youY - PADDLE, 8, 2 * PADDLE, palette(0))\n  rect(W - 16, cpuY - PADDLE, 8, 2 * PADDLE, palette(3))\n  circle(ball.x, ball.y, R, 'white')\n  text(you + ' : ' + cpu, 0, -H - 20, 'white', 18, 'center')\n})\n"},{id:"paint",title:"Kaleidoscope paint",group:"Interactive",description:"mouse, rot, screenshot: draw with rainbow ink and mirror symmetry.",code:"// Draw with the mouse; every stroke is repeated around the center.\n// Hold Space and drag to pan.\nconst strokes = []\nlet current = null\n\nfit(-300, -200, 600, 400)\n\nanimate((t) => {\n  const copies = slider('symmetry', 1, 12, 6, 1)\n  const mirror = toggle('mirror', true)\n  const width = slider('brush', 1, 10, 3, 0.5)\n  if (button('undo')) {\n    strokes.pop()\n  }\n  if (button('clear')) {\n    strokes.length = 0\n  }\n  if (button('save PNG')) {\n    screenshot('kaleidoscope')\n  }\n\n  if (mouse.clicked) {\n    current = { points: [], hue: (t * 40) % 360 }\n    strokes.push(current)\n  }\n  if (!mouse.down) {\n    current = null\n  }\n  if (current) {\n    current.points.push([mouse.x, mouse.y])\n  }\n\n  clear()\n  for (const { points, hue } of strokes) {\n    for (let k = 0; k < copies; k++) {\n      const a = (k * 2 * PI) / copies\n      const color = hsl(hue + k * 8, 85, 65)\n      polyline(points.map((p) => rot(p, a)), color, px(width))\n      if (mirror) {\n        polyline(points.map(([x, y]) => rot([x, -y], a)), color, px(width))\n      }\n    }\n  }\n})\n"},{id:"mixer",title:"Color mixer",group:"Interactive",description:"swatch, slider2d, mix, alpha: blend two palette colors.",code:"// Pick two colors and see them blended. The pad moves the second circle.\nconst first = swatch('first', 0)\nconst second = swatch('second', 6)\nconst opacity = slider('opacity', 0, 1, 0.6, 0.01)\nconst [dx, dy] = slider2d('offset', -80, 80, [50, 0])\n\nclear()\n\n// A strip of steps from the first color to the second.\nfor (let i = 0; i <= 10; i++) {\n  rect(i * 30 - 165, 90, 28, 40, mix(first, second, i / 10))\n  label(i * 10 + '%', i * 30 - 151, 80, '#aab0c4', 10, 'center')\n}\n\n// Two see-through circles: where they overlap, the colors add up.\ncircle(-50, -30, 70, alpha(first, opacity))\ncircle(-50 + dx, -30 + dy, 70, alpha(second, opacity))\n\nfit(-180, -120, 360, 260)\n"}],GM=[...new Set(VM.map(e=>e.group))]}),rC=m(()=>{});function sC(e,t){Pe(t,!0);let n,i=jt(!1),r=jt(""),s=jt(0),o=jt(void 0),a=jt(void 0);const l={Basics:200,Math:260,Data:150,Generative:320,Interactive:20},c=nt(()=>{const e=di(r).trim().toLowerCase();return e?VM.filter(t=>(t.title+" "+t.description+" "+t.group).toLowerCase().includes(e)):VM}),h=nt(()=>GM.map(e=>({group:e,items:di(c).filter(t=>t.group===e)})).filter(e=>e.items.length));function u(){Wt(i,!1)}function f(e){u(),t.onpick(e)}async function d(e){di(c).length&&(Wt(s,(di(s)+e+di(c).length)%di(c).length),await fi(),di(a)?.querySelector('[data-active="true"]')?.scrollIntoView({block:"nearest"}))}function p(e){"Escape"===e.key?(e.preventDefault(),u()):"ArrowDown"===e.key?(e.preventDefault(),d(1)):"ArrowUp"===e.key?(e.preventDefault(),d(-1)):"Enter"===e.key&&di(c)[di(s)]&&(e.preventDefault(),f(di(c)[di(s)]))}wn(()=>{di(r),Wt(s,0)});var m=tC();Ti("pointerdown",Gt,function(e){di(i)&&!n.contains(e.target)&&u()});var g=on(m);let O;var v=cn(g,2),x=e=>{var t=eC(),n=on(t);ns(n),gs(n,e=>Wt(o,e),()=>di(o));var i=cn(n,2);yr(i,21,()=>di(h),({group:e,items:t})=>e,(e,t)=>{let n=()=>di(t).group;var i=KM();let r;var o=on(i),a=ln(o,!0),h=cn(o,2);yr(h,21,()=>di(t).items,e=>e.id,(e,t)=>{const n=nt(()=>function(e){const t=e.description.indexOf(": ");return t<0?{helpers:[],blurb:e.description}:{helpers:e.description.slice(0,t).split(/,\s*|\s\+\s/).filter(Boolean),blur
